# MEL's site on GitHub Pages (antonioaltea.github.io/fmel-1, linked from www.manturon.es/fmel-1), built from main on
# every push: the simulator at the root; the installer at install/, which always offers the newest release's package
# (it is what people install on their FM-1, so never a firmware nobody tried). Run it by hand (Actions > Pages > Run
# workflow) to publish again.
name: Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  redispatch:                       # a release: the same, from main (Pages deploys only from main), as ChoralRoot does
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The simulator (main)
        run: |
          pip install ziglang==0.17.0
          ZIG="python -m ziglang" sh web/emu/build.sh
      - name: The installer (the newest release) and the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$tag" --pattern 'mel-*.fwsc' --dir release
          python tools/publish_web.py _site --fwsc release/mel-*.fwsc --version "$tag"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
